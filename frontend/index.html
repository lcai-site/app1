<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Studio - MVP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>AI Image Studio ✨</h1>
        <p>Versão MVP - Geração de Imagem a partir de Texto</p>

        <div class="form-group">
            <label for="api-key">API Key:</label>
            <input type="password" id="api-key" placeholder="Insira sua chave de API aqui">
        </div>

        <div class="form-group">
            <label for="prompt">Prompt:</label>
            <textarea id="prompt" rows="4" placeholder="Descreva a imagem que você quer criar..."></textarea>
        </div>

        <button id="generate-btn">Gerar Imagem</button>

        <div id="result-container">
            <h2>Resultado:</h2>
            <div id="image-placeholder">
                <p>A imagem gerada aparecerá aqui.</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
